<!DOCTYPE html>
<html>
<head>
    <title>Formulario</title>
</head>
<body>

<h2>Formulario de contacto</h2>

<form>

Nombre: <input type="text" maxlength="30"><br><br>

Apellido: <input type="text" maxlength="30"><br><br>

Email: <input type="email" required><br><br>

Asunto:<br>
<input type="radio" name="asunto"> Presupuesto<br>
<input type="radio" name="asunto"> Cita previa<br>
<input type="radio" name="asunto"> Otros<br><br>

¿Cómo nos conoció?:<br>
<input type="checkbox"> Un amigo<br>
<input type="checkbox"> Google<br>
<input type="checkbox"> Redes sociales<br>
<input type="checkbox"> Otros<br><br>

Mensaje:<br>
<textarea maxlength="300"></textarea><br><br>

<input type="checkbox" required> Acepto términos y condiciones<br><br>

<input type="submit" value="Enviar">

</form>

</body>
</html>
